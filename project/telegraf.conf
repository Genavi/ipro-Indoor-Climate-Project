[agent]
    interval = "10s"
    round_interval = true
    metric_batch_size = 1000
    metric_buffer_limit = 10000
    collection_jitter = "0s"
    flush_interval = "10s"
    flush_jitter = "0s"
    precision = "0s"
    hostname = ""
    omit_hostname = false

[[inputs.mqtt_consumer]]
    servers = ["tcp://iot-gateway:1883"]
    topics = [
        "sensors/#",
        "indoor-climate/#"
    ]
    username = "${MQTT_USERNAME}"
    password = "${MQTT_PASSWORD_FILE:/run/secrets/mqtt_password}"
    qos = 1
    connection_timeout = "30s"
    data_format = "json"
    json_string_fields = []
    tag_keys = ["sensor_type", "unit", "topic"]
    name_override = "sensor_readings"

[[processors.converter]]
    namepass = ["sensor_readings"]
    
    [processors.converter.fields]
        integer = ["reader", "location"]
        float = ["value"]
    
    [processors.converter.tags]
        string = ["sensor_type", "unit", "topic"]

[[outputs.postgresql]]
    connection = "host=postgres port=5432 user=${DATABASE_USER} password=${DATABASE_PASSWORD_FILE=/run/secrets/database_password} dbname=${DATABASE_NAME} sslmode=disable"
    schema = "public"
    create_templates = []
