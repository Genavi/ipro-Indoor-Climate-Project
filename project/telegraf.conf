[agent]
    interval = "10s"
    round_interval = true
    metric_batch_size = 1000
    metric_buffer_limit = 10000
    collection_jitter = "0s"
    flush_interval = "10s"
    flush_jitter = "0s"
    precision = "0s"
    hostname = ""
    omit_hostname = false
    skip_processors_after_aggregators = false

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  perdevice_include = ["cpu", "blkio", "network"]
  total_include = ["cpu", "blkio", "network"]
  container_name_include = []
  timeout = "5s"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.net]]
  interfaces = ["eth*", "en*"]

[[inputs.system]]

[[inputs.mqtt_consumer]]
    servers = ["tcp://mosquitto:1883"]
    topics = [
        "sensors/#",
        "indoor-climate/#"
    ]
    username = "${MQTT_USERNAME}"
    password = "${MQTT_PASSWORD}"
    qos = 1
    connection_timeout = "30s"
    data_format = "json"
    json_string_fields = []
    tag_keys = ["sensor_type", "unit", "topic"]
    name_override = "sensor_readings"

[[processors.converter]]
    namepass = ["sensor_readings"]
    
    [processors.converter.fields]
        integer = ["reader", "location"]
        float = ["value"]
    
    [processors.converter.tags]
        string = ["sensor_type", "unit", "topic"]

[[outputs.postgresql]]
    connection = "host=postgres port=5432 user=${DATABASE_USER} password=${DATABASE_PASSWORD} dbname=${DATABASE_NAME} sslmode=disable"
    schema = "public"
    create_templates = [
        '''CREATE TABLE IF NOT EXISTS {{.table}} ({{.columns}})''',
        '''SELECT create_hypertable({{.table|quoteLiteral}}, 'time', chunk_time_interval => INTERVAL '1 day', if_not_exists => TRUE)''',
    ]
