secrets:
  database_password:
    file: ../secrets/db_password.txt
  mqtt_password:
    file: ../secrets/mqtt_password.txt
  tailscale_authkey:
    file: ../secrets/ts_authkey.txt

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: iot-gateway
    restart: always
    user: "0"
    secrets:
      - tailscale_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/tailscale_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ACCEPT_DNS=false
      - TS_HOSTNAME=iot-gateway
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    networks:
      - iot_net

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/config/pwfile:/mosquitto/config/pwfile
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    user: "0"
    secrets:
      - mqtt_password
      - database_password
    depends_on:
      - postgres
      - mosquitto
      - tailscale
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD_FILE=/run/secrets/mqtt_password
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD_FILE=/run/secrets/database_password
      - DATABASE_NAME=${DATABASE_NAME}
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    dns:
      - 100.100.100.100
    networks:
      - iot_net

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: postgres
    restart: unless-stopped
    user: "0"
    secrets:
      - database_password
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iot_net

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=https://iot-gateway.tail7a645b.ts.net
    depends_on:
      - postgres
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - iot_net

networks:
  iot_net:
    driver: bridge

volumes:
  mosquitto_data: {}
  mosquitto_log: {}
  grafana_data: {}
  tailscale_data: {}
  postgres_data: {}
